[project]
name = "grub-map-api"
version = "0.1.0"
description = "Grub Map API: anonymous \"still this price?\" votes on lunch deals"
authors = [
    { name = "Lasit Pant", email = "lasitpant19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
grub-map-api = "grub_map_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
